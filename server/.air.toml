root = "."
tmp_dir = "server/tmp"

[build]
  bin = "./server/tmp/sygma"
  cmd = "pnpm build && cd server && go build -o ./tmp/sygma ."
  delay = 1000
  exclude_dir = ["server/tmp", "server/dist", "node_modules", ".git"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "ts", "tsx", "css", "html"]
  include_dir = ["src", "server"]
  include_file = ["index.html"]
  kill_delay = "0s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
