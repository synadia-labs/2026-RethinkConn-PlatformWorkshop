version: "3"

dotenv: [".env"]

vars:
  SERVER_DIR: server

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  dev:
    desc: Run frontend dev server and Go service with hot reload
    deps: [dev:frontend, dev:server]

  dev:frontend:
    desc: Run Vite dev server
    cmd: pnpm dev

  dev:server:
    desc: Run Go service with Air hot reload
    cmd: air -c server/.air.toml -- -service-account-nkey ${SERVICE_ACCOUNT_NKEY:-MISSING} -nats ${NATS_URL:-nats://localhost:4222} -cp-url ${CP_URL:-https://cloud.synadia.com}

  dev:nats:
    desc: Run local NATS server
    cmd: nats-server -c nats.conf

  build:
    desc: Build frontend and Go binary
    cmds:
      - task: build:frontend
      - task: build:server

  build:frontend:
    desc: Build frontend into server/dist
    cmd: pnpm build

  build:server:
    desc: Build Go binary
    dir: "{{.SERVER_DIR}}"
    cmd: go build -o sygma .
    deps: [build:frontend]

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf server/dist server/sygma server/tmp

  lint:
    desc: Run linters
    cmds:
      - pnpm lint
      - cd {{.SERVER_DIR}} && go vet ./...

  test:
    desc: Run tests
    cmds:
      - pnpm test
      - cd {{.SERVER_DIR}} && go test ./...
